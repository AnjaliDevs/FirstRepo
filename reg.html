<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration From</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
    <div class=" flex flex-col justify-center items-center mt-5  ">
        <h1>REGISTRATION FORM</h1>

        <div class=" w-100 h-128 bg-amber-200 flex-col rounded-2xl">

            <h1 class=" text-lg mt-2 ml-4">Full Name</h1>
            <div class=" w-60 h-6 bg-gray-400 ml-3 rounded-xl px-4">
                <input type "text" placeholder="Enter your name "> </div>
            <h1 class=" text-lg mt-2 ml-4 ">Email</h1>
            <div class=" w-60 h-6 bg-gray-400 ml-3 rounded-xl px-4 ">
                <input type "email " placeholder="Enter your email "> </div>
            <h1 class=" text-lg mt-2 ml-4 ">Password</h1>
            <div class=" w-60 h-6 bg-gray-400 ml-3 rounded-xl px-4 ">
                <input type "password " placeholder="Enter your password "> </div>
            <h1 class=" text-lg mt-2 ml-4 ">Confirm Password</h1>
            <div class=" w-60 h-6 bg-gray-400 ml-3 rounded-xl px-4">
                <input type "password " placeholder="Enter your password "> </div>
            <h1 class=" text-lg mt-2 ml-4 ">Gender</h1>
            <div class=" w-60 h-6 bg-gray-400 ml-3 rounded-xl px-4 ">
                 <select>
                    <option>select gender</option>
                    <option>male</option>
                    <option>female</option>
                    <option>others</option>
                </select>
            </div>
           <h1 class=" text-lg mt-2 ml-4">Phone Number</h1>
           <div class=" w-60 h-6 bg-gray-400 ml-3 rounded-xl px-4 ">
                <input type "tel" placeholder="Enter your number "> </div>
        <div class="flex-col bg-blue w-5 h-4 items-center "> <button>Register</button></div>
        </div>
    </div>
</body>

</html>
